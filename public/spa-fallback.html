<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>器 · 茶 | 东亚茶器艺术展</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #faf9f7;
      color: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .loading {
      text-align: center;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 2px solid #b8956c;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .message {
      color: #666;
      font-size: 14px;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0f0f0e; color: #e8e6e3; }
      .message { color: #9a9894; }
    }
  </style>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var params = new URLSearchParams(window.location.search);
      var lang = params.get('lang');
      if (!['zh', 'en', 'ja', 'ko'].includes(lang)) {
        try { lang = localStorage.getItem('teaware-language-v1'); } catch (e) {}
      }
      if (!['zh', 'en', 'ja', 'ko'].includes(lang)) lang = 'zh';
      var index = ['zh', 'en', 'ja', 'ko'].indexOf(lang);
      document.documentElement.lang = ['zh-CN', 'en', 'ja', 'ko'][index];
      document.title = ['东亚茶器艺术展', 'East Asian Teaware Art Exhibition', '東アジア茶器芸術展', '동아시아 다구 예술전'][index];
      var basePath = '/teaware';
      var path = window.location.pathname;
      if (path.startsWith(basePath)) path = path.substring(basePath.length);
      var match = path.match(/^\/artwork\/([^\/]+)\/?$/);
      params.set('lang', lang);
      if (match) {
        params.set('id', decodeURIComponent(match[1]));
        window.location.replace(basePath + '/artwork/?' + params.toString() + window.location.hash);
      } else {
        document.getElementById('message').textContent = ['页面未找到，正在跳转至首页…', 'Page not found. Returning home…', 'ページが見つかりません。ホームに戻ります…', '페이지를 찾을 수 없습니다. 홈으로 돌아갑니다…'][index];
        setTimeout(function() { window.location.replace(basePath + '/?lang=' + lang); }, 2000);
      }
    });
  </script>
</head>
<body>
  <div class="loading">
    <div class="spinner"></div>
    <p id="message" class="message">加载中...</p>
  </div>
</body>
</html>
