name: Retrieve next open tea object batch
on:
  push:
    branches: [expansion-6000]
    paths: ['.github/workflows/curation-dimu-6000.yml', 'research/dimu-candidates-6000-*.json']
permissions:
  contents: read
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - run: DIMU_OUTPUT=source-probe DIMU_CANDIDATES=research/dimu-candidates-6000-c.json python scripts/fetch-dimu-teaware.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dimu-next-tea-images-c
          path: source-probe
          retention-days: 1
