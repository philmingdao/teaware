name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify artwork JPEGs (not LFS pointers)
        run: |
          set -euo pipefail
          sample=$(find public/artworks -type f \( -name '*.jpg' -o -name '*.jpeg' -o -name '*.png' -o -name '*.webp' \) -print -quit)
          if [ -z "$sample" ]; then
            echo "ERROR: no artwork images under public/artworks"
            exit 1
          fi
          if head -c 64 "$sample" | grep -q 'git-lfs.github.com\|version https://git-lfs'; then
            echo "ERROR: $sample is still a Git LFS pointer"
            head -c 200 "$sample" || true
            exit 1
          fi
          echo "OK: $sample looks like binary media ($(wc -c < "$sample") bytes)"
          ls public/artworks | wc -l

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify built image paths
        run: |
          node --input-type=module <<'JSVERIFY'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('src/data/collection-cutouts.json'));
          const artworks = JSON.parse(fs.readFileSync('src/data/artworks.json'));
          if (Object.keys(manifest.assets).length) {
            const served = JSON.parse(fs.readFileSync('out/artworks.json'));
            if (served.length !== artworks.length) throw new Error('Catalogue coverage changed');
            for (const item of served) {
              const asset = manifest.assets[item.id];
              if (!asset || asset.qaStatus !== 'reviewed' || item.imageUrl !== asset.url) throw new Error('Missing approved transparent image: ' + item.id);
              const bytes = fs.readFileSync('out' + item.imageUrl);
              if (bytes.subarray(0,4).toString() !== 'RIFF' || bytes.subarray(8,12).toString() !== 'WEBP') throw new Error('Missing WebP bytes: ' + item.id);
            }
            if (fs.existsSync('out/artworks')) throw new Error('Original photographs duplicated in transparent release');
            console.log('OK: complete approved transparent image coverage');
          } else {
            const sample = fs.readdirSync('out/artworks').find(name => name.endsWith('.jpg'));
            if (!sample || fs.readFileSync('out/artworks/' + sample).subarray(0,64).toString().includes('git-lfs')) throw new Error('Missing actual original JPEGs');
            console.log('OK: existing original-image release retained during processing');
          }
          JSVERIFY

      - name: Check artifact size (must be under 950MB for GitHub Pages)
        run: |
          set -euo pipefail
          SIZE_BYTES=$(du -sb out | cut -f1)
          SIZE_MB=$((SIZE_BYTES / 1024 / 1024))
          MAX_SIZE_MB=950
          echo "Build output size: ${SIZE_MB}MB (${SIZE_BYTES} bytes)"
          echo "Maximum allowed: ${MAX_SIZE_MB}MB"
          if [ "$SIZE_MB" -gt "$MAX_SIZE_MB" ]; then
            echo "ERROR: Output size ${SIZE_MB}MB exceeds ${MAX_SIZE_MB}MB limit"
            echo "GitHub Pages artifact limit is 1GB. Leaving headroom for safety."
            du -sh out/*/ | sort -hr | head -10
            exit 1
          fi
          echo "OK: Output size is within limits"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
