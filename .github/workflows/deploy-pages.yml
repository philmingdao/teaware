name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify artwork JPEGs (not LFS pointers)
        run: |
          set -euo pipefail
          sample=$(find public/artworks -type f \( -name '*.jpg' -o -name '*.jpeg' -o -name '*.png' -o -name '*.webp' \) -print -quit)
          if [ -z "$sample" ]; then
            echo "ERROR: no artwork images under public/artworks"
            exit 1
          fi
          if head -c 64 "$sample" | grep -q 'git-lfs.github.com\|version https://git-lfs'; then
            echo "ERROR: $sample is still a Git LFS pointer"
            head -c 200 "$sample" || true
            exit 1
          fi
          echo "OK: $sample looks like binary media ($(wc -c < "$sample") bytes)"
          ls public/artworks | wc -l

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify built image paths
        run: |
          set -euo pipefail
          if [ ! -d out/artworks ]; then
            echo "ERROR: out/artworks missing after build"
            exit 1
          fi
          sample=$(find out/artworks -type f -name '*.jpg' -print -quit)
          if [ -z "$sample" ]; then
            echo "ERROR: no jpg under out/artworks"
            exit 1
          fi
          if head -c 64 "$sample" | grep -q 'git-lfs.github.com\|version https://git-lfs'; then
            echo "ERROR: built artifact still has LFS pointer"
            exit 1
          fi
          if grep -R -l '/teaware/artworks/' out --include='*.html' | head -1 | grep -q .; then
            echo "OK: HTML references /teaware/artworks/"
          else
            echo "WARN: no /teaware/artworks/ found in HTML"
            grep -R -n 'artworks/' out --include='*.html' | head -20 || true
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
