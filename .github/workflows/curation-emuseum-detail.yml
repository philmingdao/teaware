name: Inspect public tea image metadata
on:
  push:
    branches: [expansion-6000]
    paths: ['scripts/probe-emuseum-detail.py', '.github/workflows/curation-emuseum-detail.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - run: python scripts/probe-emuseum-detail.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emuseum-detail-samples
          path: source-probe
          retention-days: 1
