name: Inspect public museum collection entry points
on:
  push:
    branches: [expansion-6000]
    paths: ['.github/workflows/curation-museum-probe.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          mkdir source-probe
          curl --fail --location --silent --show-error --max-time 60 https://samlingar.shm.se/assets/main-f46c60b74e6f22c0b811.js -o source-probe/shm-main.js
          curl --fail --location --silent --show-error --max-time 60 'https://samlingar.shm.se/sok?type=object&query=tekanna&hasImage=1' -o source-probe/shm-search.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-museum-entry-points
          path: source-probe
          retention-days: 1
