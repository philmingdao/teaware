name: Inspect public museum collection entry points
on:
  push:
    branches: [expansion-6000]
    paths: ['.github/workflows/curation-museum-probe.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          mkdir source-probe
          curl --fail --location --silent --show-error --max-time 60 https://samlingar.shm.se/ -o source-probe/shm-home.html
          curl --fail --location --silent --show-error --max-time 60 https://skd-online-collection.skd.museum/ -o source-probe/skd-home.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-museum-entry-points
          path: source-probe
          retention-days: 1
