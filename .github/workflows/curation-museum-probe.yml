name: Inspect public museum collection entry points
on:
  push:
    branches: [expansion-6000]
    paths: ['.github/workflows/curation-museum-probe.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          mkdir source-probe
          curl --fail --location --silent --show-error --max-time 60 'https://samlingar.shm.se/api/v1/search?type=object&query=tekanna&hasImage=1' -o source-probe/shm-api.json
          curl --fail --location --silent --show-error --max-time 60 https://samlingar.shm.se/object/6435F4E1-91C8-4C0D-96DB-D9423949D6AC -o source-probe/shm-object.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-museum-entry-points
          path: source-probe
          retention-days: 1
