name: Discover open museum tea objects
on:
  push:
    branches: [expansion-4000]
    paths: ['.github/workflows/curation-finna.yml', 'scripts/discover-finna-teaware.py']
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - run: python3 scripts/discover-finna-teaware.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finna-tea-metadata
          path: source-probe
          retention-days: 1
