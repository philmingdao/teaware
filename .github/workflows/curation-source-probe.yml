name: Probe public curation sources
on:
  push:
    branches: [expansion-4000]
    paths: ['.github/workflows/curation-source-probe.yml', 'scripts/probe-curation-sources.py']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Retrieve public source samples
        run: python3 scripts/probe-curation-sources.py
      - uses: actions/upload-artifact@v4
        with:
          name: public-curation-source-samples
          path: source-probe
          retention-days: 1
