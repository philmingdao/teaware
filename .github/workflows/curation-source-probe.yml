name: Retrieve public curation candidates
on:
  push:
    branches: [expansion-4000]
    paths: ['.github/workflows/curation-source-probe.yml', 'scripts/fetch-npm-candidates.py', 'research/npm-candidates-4000.json']
permissions:
  contents: read
jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Retrieve public source candidates
        run: python3 scripts/fetch-npm-candidates.py ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-candidates-${{ matrix.shard }}
          path: source-probe
          retention-days: 1
