name: Retrieve public NMK tea objects
on:
  push:
    branches: [expansion-4000]
    paths: ['scripts/fetch-nmk-teaware.py', '.github/workflows/curation-nmk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - run: NMK_OUTPUT=source-probe python scripts/fetch-nmk-teaware.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nmk-tea-images
          path: source-probe
          retention-days: 1
