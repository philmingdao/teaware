name: Discover additional public museum tea objects
on:
  push:
    branches: [expansion-4000]
    paths: ['scripts/fetch-extra-public-teaware.py', '.github/workflows/curation-public-extras.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - run: python scripts/fetch-extra-public-teaware.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-museum-extras
          path: source-probe
          retention-days: 1
